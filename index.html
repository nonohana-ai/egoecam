<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>在庫帳のカメラ</title>
<style>
:root{--bg:#EDF0EE;--surface:#fff;--ink:#16201B;--muted:#5C6B64;--accent:#0E7357;--bad:#C2372B}
@media (prefers-color-scheme:dark){:root{--bg:#121815;--surface:#1C2420;--ink:#E8EEEA;--muted:#9AA8A1;--accent:#3FBF94;--bad:#F07A6E}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:17px;line-height:1.6}
main{max-width:520px;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;gap:16px}
h1{font-size:20px;margin:0}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:72px;border-radius:14px;background:var(--accent);color:#fff;font-size:22px;font-weight:700;cursor:pointer;border:0;width:100%}
.btn.sub{background:var(--surface);color:var(--ink);border:1px solid var(--muted);min-height:52px;font-size:17px}
input[type=file]{display:none}
[hidden]{display:none!important}
#msg{background:var(--surface);border-radius:12px;padding:14px;min-height:56px}
#msg.ng{color:var(--bad);font-weight:700}
img{max-width:100%;border-radius:12px}
.note{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
  <h1>在庫帳のカメラ</h1>
  <label class="btn" for="shot" id="shotBtn">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    撮る<input type="file" id="shot" accept="image/*" capture="environment">
  </label>
  <div id="msg">「撮る」を押すとカメラが開きます。撮った写真は在庫帳に送られます。</div>
  <img id="prev" alt="" hidden>
  <button type="button" class="btn sub" id="back" hidden>在庫帳に戻る</button>
  <p class="note">このページは在庫帳の撮影ボタンから開きます。写真はこのページには残りません。</p>
</main>
<script>
(() => {
  const q = new URLSearchParams(location.hash.slice(1));
  const key = q.get("k") || "", url = q.get("u") || "";
  const okUrl = /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/(exec|dev)$/.test(url) && /^[0-9a-f]{40}$/.test(key);
  const $ = s => document.querySelector(s), msg = (t, ng) => { $("#msg").textContent = t; $("#msg").className = ng ? "ng" : ""; };
  // アドレスに合言葉を残さない
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
  if (!okUrl) { msg("在庫帳の撮影ボタンから開いてください。", true); $("#shotBtn").hidden = true; return; }
  const toJpeg = f => new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(f);
    img.onload = () => {
      const m = 1600, r = Math.min(1, m / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      res(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error("img")); };
    img.src = u;
  });
  const back = () => { try { window.close(); } catch (e) {} setTimeout(() => msg("送りました。このタブを閉じて、在庫帳のタブに戻ってください。"), 400); };
  $("#back").onclick = back;
  $("#shot").addEventListener("change", async e => {
    const f = e.target.files && e.target.files[0]; e.target.value = "";
    if (!f) return;
    let data;
    try { data = await toJpeg(f); } catch (err) { msg("写真を読み込めませんでした。もう一度撮ってください。", true); return; }
    $("#prev").src = data; $("#prev").hidden = false;
    msg("送っています…");
    const body = JSON.stringify({ action: "camPut", key, data });
    let r = null;
    for (let i = 0; i < 2 && !r; i++) {
      try { r = await (await fetch(url, { method: "POST", body, redirect: "follow" })).json(); }
      catch (err) { if (i) { msg("送れませんでした。電波のよい所で、もう一度撮ってください。", true); return; } await new Promise(z => setTimeout(z, 1500)); }
    }
    if (!r.ok) {
      msg(r.error === "KEY" ? "時間が切れました。在庫帳に戻って、もう一度撮影ボタンを押してください。" : "送れませんでした。もう一度撮ってください。", true);
      return;
    }
    msg("送りました。在庫帳に戻ります…");
    $("#back").hidden = false; $("#shotBtn").hidden = true;
    setTimeout(back, 900);
  });
})();
</script>
</body>
</html>
